<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>スマホセンサ操作3Dボーリング</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
        <style>
            body {
                font-family: sans-serif;
                margin: 10px;
                text-align: center;
                background-color: #f0f0f0;
            }
            h1 {
                color: #333;
                margin-bottom: 5px;
            }
            
            /*p5.jsのキャンバス範囲*/
            #canvas-wrapper {
                position: relative;
                margin: 5px auto;
                width: 600px;
                height: 250px;
            }
            #game-container {
                width: 100%;
                height: 100%;
                border: 2px solid #666;
                background-color: #000;
            }
            canvas {
                display: block;
            }

            /* ボタン関連のCSS */
            button {
                padding: 10px 20px;
                margin: 5px;
                font-size: 16px;
                cursor: pointer;
                background-color: #61dafb;
                color: #282c34;
                border: none;
                border-radius: 5px;
                transition: background-color 0.3s;
            }
            button:hover:not(:disabled) {
                background-color: #21a1f1;
            }
            button:disabled {
                background-color: #888;
                cursor: not-allowed;
            }

            /* 文字の色 */
            #status {
                color:#21a1f1;
            }

            /* スコア関連のCSS */
            #score {
                font-size: 1.5em;
                font-weight: bold;
                margin: 10px 0;
                padding: 3px 15px;
                border: 1px solid #333;
                display: inline-block;
                background-color: #fff;
                color: #333;
            }

            /* 矢印UI (キャンバスの下に配置) */
            #guidance-ui {
                width: 600px;
                margin: 10px auto 0;
                display: none;
                justify-content: space-between;
                background-color:#888;
                align-items: center;
                padding: 5px 0;
                border-radius: 8px;
                text-align: center;
            }
            #guidance-ui.active {
                display: flex;
            }
            .guidance-arrow {
                font-size: 4rem;
                padding: 0 30px;
                animation: pulse 1.5s infinite;
                font-weight: bolder;
            }
            /* 矢印の色指定 */
            #left-arrow-ui, #right-arrow-ui {
                color: #ffc300; /* 黄色 */
                text-shadow: 0 0 10px #ffc300;
            }
            #up-arrow-ui {
                color: #00ff00; /* 緑 */
                text-shadow: 0 0 10px #00ff00;
            }
        </style>
    </head>

    <body>
        <h1>3Dボーリングゲーム</h1>
        <div>
        <div>あなたのID: <span id="myid"></span></div>
            <div>
                <button id="connect">ルームに入って投球準備</button>
                <button id="reset" disabled>ピンをリセット</button>
            </div>
        <div id="status">スマホからのセンサ接続待機中... / スマホを水平な場所に置いてください</div>
        </div>
        
        <div class="score-display">
            ピン数: 10 ・ 倒したピン / 総合スコア: <span id="score">0 / 0</span>
        </div>

        <div id="canvas-wrapper">
            <div id="game-container"></div>
        </div>
        
        <div id="guidance-ui">
            <div id="left-arrow-ui" class="guidance-arrow">⇦</div>
            <div id="up-arrow-ui" class="guidance-arrow">⇧</div>
            <div id="right-arrow-ui" class="guidance-arrow">➡</div>
        </div>

        <script>
            let socket = io.connect();
            let g = 0;
            let b = 0;

            let btnConnect = document.querySelector("#connect");
            let btnReset = document.querySelector("#reset");
            let statusDiv = document.querySelector("#status");
            let scoreDiv = document.querySelector("#score");
            let guidanceUi = document.querySelector("#guidance-ui");

            let myid = sessionStorage.getItem('clientId');
            if (!myid) {
                myid = Math.random().toString(36).substring(2, 15);
                sessionStorage.setItem('clientId', myid);
            }
        
            document.querySelector("#myid").innerHTML = myid;
            console.log("あなたのID: ", myid);

            let isReadyToThrow = false;
            let isThrown = false;
            let score = 0;
            let pinsKnocked = 0;

            // UIガイダンス表示/非表示を制御するフラグ
            let showGuidance = false;

            function updateGuidanceUI() {
                if (showGuidance) {
                    guidanceUi.classList.add('active'); // 矢印(キャンバスの下)
                } else {
                    guidanceUi.classList.remove('active');
                }
            }

            btnConnect.addEventListener("click", function () {
                socket.emit("join", "game");
                isReadyToThrow = true;
                showGuidance = true;
                updateGuidanceUI();
                statusDiv.innerHTML = "投球準備OK！スマホの画面に従って操作してください。";
                btnConnect.disabled = true;
                btnConnect.textContent = "接続済み";
                if (window.p5Instance) {
                    window.p5Instance.resetBallAndPins();
                }
            });

            btnReset.addEventListener("click", resetGame);

            socket.on("sensor", function (data) {
                g = parseFloat(data.g);
                b = parseFloat(data.b);

                if (isReadyToThrow && !isThrown) {
                    const THROW_THRESHOLD = 15;
                    
                    if (window.p5Instance) {
                        const sensitivity = 0.5;
                        window.p5Instance.aimBall(g * sensitivity);
                    }

                    if (Math.abs(g) > THROW_THRESHOLD || Math.abs(b) > THROW_THRESHOLD) {
                        if (window.p5Instance) {
                            window.p5Instance.throwBall(g, b);
                        }
                        isThrown = true;
                        isReadyToThrow = false;
                        showGuidance = false;
                        updateGuidanceUI();
                        statusDiv.innerHTML = "ボールが投げられました！";
                    }
                }
            });

            // p5.jsGameLogic
            let ballX;
            let ballZ;
            let ballRadius = 20;
            let ballVX = 0;
            let ballVZ = 0;
            let friction = 0.99;

            let pins = [];
            const PIN_RADIUS = 10;
            const PIN_HEIGHT = 50;
            const PIN_LANE_Z = -300;
            const LANE_WIDTH = 250;
            const LANE_LENGTH = 1000;
            const MAX_CANVAS_SIZE = 1000;

            // ピンの初期配置 (X座標とZ座標)
            const pinInitialOffsets = [
                { x: 0, z: PIN_LANE_Z },
                { x: -PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 3 },
                { x: PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 3 },
                { x: -PIN_RADIUS * 4, z: PIN_LANE_Z - PIN_RADIUS * 6 },
                { x: 0, z: PIN_LANE_Z - PIN_RADIUS * 6 },
                { x: PIN_RADIUS * 4, z: PIN_LANE_Z - PIN_RADIUS * 6 },
                { x: -PIN_RADIUS * 6, z: PIN_LANE_Z - PIN_RADIUS * 9 },
                { x: -PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 9 },
                { x: PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 9 },
                { x: PIN_RADIUS * 6, z: PIN_LANE_Z - PIN_RADIUS * 9 },
            ];

            // インスタンスモードを使用する（独立させる）
            const sketch = (p) => {
                p.setup = () => {
                    const container = document.getElementById('game-container');
                    const w = container.clientWidth;
                    const h = container.clientHeight;

                    // コンテナの幅wと高さhを使ってキャンバスを作成する
                    p.createCanvas(w, h, p.WEBGL).parent('game-container');
                    p.angleMode(p.DEGREES);
                    p.noStroke();
                    
                    // 初期カメラ位置
                    p.camera(0, -80, 400, 
                            0, 0, 0,    
                            0, 1, 0);      
                    
                    p.resetBallAndPins();
                    window.p5Instance = p;
                };

                p.draw = () => {
                    // 環境設定
                    p.background(0);
                    p.orbitControl();

                    // ライト設定
                    p.ambientLight(100);
                    p.directionalLight(255, 255, 255, 0, 1, -1);
                    p.pointLight(200, 200, 200, 0, 300, 300);
                    
                    // レーンの描画
                    p.drawLane();

                    // ボールの更新と描画
                    p.updateBall();
                    p.drawBall();

                    // ピンの描画と衝突判定
                    p.drawPins();

                    // 投球準備完了時のみ、3D空間に方向ガイドラインを描画
                    if (showGuidance) {
                        p.drawForwardGuideline();
                    }
                };
                
                p.drawForwardGuideline = () => {
                    // ボールの横位置を示すための線
                    p.push();
                    p.stroke(255, 200, 0, 150);
                    p.strokeWeight(2);
                    p.line(ballX, 0, ballZ, ballX, 0, PIN_LANE_Z); // ボールからピンエリアまで線を引く
                    p.noStroke();
                    p.pop();
                }

                p.drawLane = () => {
                    p.push();
                    p.fill(139, 69, 19); // レーン：茶色
                    p.translate(0, 5, -LANE_LENGTH/2 + 200);
                    p.box(LANE_WIDTH, 10, LANE_LENGTH);
                    p.pop();
                }
                
                // ボールを更新
                p.updateBall = () => {
                    if (isThrown) {
                        ballX += ballVX;
                        ballZ += ballVZ;

                        ballVX *= friction;
                        ballVZ *= friction;

                        let halfLaneWidth = LANE_WIDTH / 2;
                        if (ballX < -halfLaneWidth + ballRadius || ballX > halfLaneWidth - ballRadius) {
                            ballVX *= -0.8;
                            ballX = p.constrain(ballX, -halfLaneWidth + ballRadius, halfLaneWidth - ballRadius);
                        }
                        
                        if (ballZ < -LANE_LENGTH / 2) {
                            ballVZ = 0;
                        }

                        if (p.abs(ballVX) < 0.1 && p.abs(ballVZ) < 0.1) {
                            if (isThrown) {
                                p.checkScore();
                                isThrown = false;
                                statusDiv.innerHTML = "投球終了。スコアを確認し、リセットしてください。";
                                btnReset.disabled = false;
                            }
                        }

                        if (ballZ < PIN_LANE_Z + 100) {
                            p.handleCollision();
                        }
                    }
                };

                // ボールを描画する
                p.drawBall = () => {
                    p.push();
                    p.specularMaterial(223, 41, 53); // ボール：赤
                    p.translate(ballX, -ballRadius, ballZ);
                    p.sphere(ballRadius);
                    p.pop();
                };

                // ピンの描画と衝突判定
                p.drawPins = () => {
                    p.fill(255);
                    pins.forEach(pin => {
                        p.push();
                        p.translate(pin.x, -PIN_HEIGHT/2, pin.z);
                        
                        if (!pin.isDown) {
                            p.cylinder(PIN_RADIUS, PIN_HEIGHT);
                        } else {
                            p.fill(170); // 倒れたピンは灰色
                            p.rotateX(90);
                            p.cylinder(PIN_RADIUS, PIN_HEIGHT);
                        }
                        p.pop();
                    });
                };

                // ボールとピンの衝突判定
                p.handleCollision = () => {
                    pins.forEach(pin => {
                        if (!pin.isDown) {
                            const dist = p.dist(ballX, ballZ, pin.x, pin.z);
                            
                            if (dist < ballRadius + PIN_RADIUS) {
                                pin.isDown = true;
                                
                                pinInitialOffsets.forEach((otherOffset, otherIndex) => {
                                    if (pin !== pins[otherIndex] && !pins[otherIndex].isDown) {
                                        const chainDist = p.dist(pin.x, pin.z, otherOffset.x, otherOffset.z);
                                        if (chainDist < PIN_RADIUS * 4 && p.random(1) < 0.5) {
                                                pins[otherIndex].isDown = true;
                                        }
                                    }
                                });
                            }
                        }
                    });
                };
                
                // スコアの更新
                p.checkScore = () => {
                    let currentKnocked = 0;
                    pins.forEach(pin => {
                        if (pin.isDown && !pin.counted) {
                            pin.counted = true;
                            currentKnocked++;
                        }
                    });

                    if (currentKnocked > 0) {
                        pinsKnocked += currentKnocked;
                        score += currentKnocked;
                        scoreDiv.innerHTML = `${pinsKnocked} / ${score}`;
                    }
                };
                
                // ボールとピンをリセット
                p.resetBallAndPins = () => {
                    ballX = 0;
                    ballZ = 300;
                    ballVX = 0;
                    ballVZ = 0;
                    
                    pins = pinInitialOffsets.map(offset => ({
                        x: offset.x,
                        z: offset.z,
                        isDown: false,
                        counted: false,
                    }));
                };

                // ボールを投げる方向を決定
                p.aimBall = (lateralInput) => {
                    if (!isThrown && p.abs(ballVX) < 0.1 && p.abs(ballVZ) < 0.1) {
                        const aimSpeed = 0.5;
                        ballX += lateralInput * aimSpeed;
                        
                        let halfLaneWidth = LANE_WIDTH / 2;
                        ballX = p.constrain(ballX, -halfLaneWidth + ballRadius, halfLaneWidth - ballRadius);
                    }
                };

                // ボールを投げたら
                p.throwBall = (g, b) => {
                    const MAX_SPEED = 25;
                    const MIN_SPEED = 10;    
                    const THROW_FACTOR = 0.5;

                    let forwardVelocity = p.constrain(p.abs(b) * THROW_FACTOR, MIN_SPEED, MAX_SPEED);
                    ballVZ = -forwardVelocity;
                    
                    ballVX = 0;

                    isThrown = true;
                    btnReset.disabled = false;
                };

                p.windowResized = () => {
                    const container = document.getElementById('game-container');
                    p.resizeCanvas(container.clientWidth, container.clientHeight);
                };
            };

            new p5(sketch, 'game-container');

            // ゲームのリセット
            function resetGame() {
                pinsKnocked = 0;
                scoreDiv.innerHTML = `${pinsKnocked} / ${score}`;
                if (window.p5Instance) {
                    window.p5Instance.resetBallAndPins();
                }
                isThrown = false;
                isReadyToThrow = true; // リセット後は投球準備状態に戻す
                showGuidance = true; // 矢印UI再表示
                updateGuidanceUI();
                statusDiv.innerHTML = "投球準備OK！スマホの画面に従って操作してください。";
                btnReset.disabled = true;
            }
        </script>
    </body>
</html>
