<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>スマホセンサ操作3Dボーリング</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.3/socket.io.js"></script>
        <style>
            <!--style->
            body {
                font-family: sans-serif;
                margin: 20px;
                text-align: center;
                background-color: #f0f0f0;
            }
            h1 {
                color: #333;
            }
            #game-container {
                margin: 20px auto;
                /* 元のコードの800x800に準拠 */
                width: 800px;
                height: 800px; 
                border: 2px solid #666;
                background-color: #000; /* 3D背景は黒 */
            }
            canvas {
                display: block;
            }
            .score-display {
                font-size: 1.5em;
                font-weight: bold;
                margin: 10px 0;
                padding: 5px 15px;
                border: 1px solid #333;
                display: inline-block;
                background-color: #fff;
                color: #333;
            }
        </style>
    </head>
  <body>
    <h1>3Dボーリングゲーム</h1>
    <h2>スマホからのセンサ情報を受信</h2>
    <div>
      <div>あなたのID: <span id="myid"></span></div>
      <button id="connect">ルームに入る</button>
      <div>受信した情報はコンソールログで確認してください</div>
    </div>
    
    <div class="score-display">
        倒したピン数 / スコア: <span id="score">0 / 0</span>
    </div>

    <div id="game-container"></div>

    <div class="controls">
        <button id="reset" style="padding: 10px 20px; margin-top: 10px;" disabled>ピンをリセット</button>
        <div style="font-size: 0.9em; color: #666; margin-top: 10px;">
            投球準備後、スマホを振る（前後、左右）ことでボールを投げられます。
        </div>
    </div>

    <script>
        //--
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
      
        let socket = io.connect();

        let btn = document.querySelector("#connect");
        let g = 0;
        let b = 0;

        let btnConnect = document.querySelector("#connect");
        let btnReset = document.querySelector("#reset");
        let statusDiv = document.querySelector("#status");
        let scoreDiv = document.querySelector("#score");

        let myid = sessionStorage.getItem('clientId');
        if (!myid) {
            myid = Math.random().toString(36).substring(2, 15);
            sessionStorage.setItem('clientId', myid);
        }
      
        document.querySelector("#myid").innerHTML = myid;
        console.log("あなたのID: ", myid);

        let isReadyToThrow = false;
        let isThrown = false;
        let score = 0;
        let pinsKnocked = 0;

        btnConnect.addEventListener("click", function () {
            socket.emit("join", "game");
            isReadyToThrow = true;
            statusDiv.innerHTML = "投球準備OK！スマホを振ってください。";
            btnConnect.disabled = true;
            btnConnect.textContent = "接続済み";
            if (window.p5Instance) {
                window.p5Instance.resetBallAndPins();
            }
        });

        btnReset.addEventListener("click", resetGame);

        socket.on("sensor", function (data) {
            g = parseFloat(data.g); 
            b = parseFloat(data.b); 
            console.log("Sensor Data (g, b):", g, b);

            if (isReadyToThrow && !isThrown) {
                const THROW_THRESHOLD = 15; // センサー値の閾値
                if (Math.abs(g) > THROW_THRESHOLD || Math.abs(b) > THROW_THRESHOLD) {
                    if (window.p5Instance) {
                        window.p5Instance.throwBall(g, b);
                    }
                    isThrown = true;
                    isReadyToThrow = false;
                    statusDiv.innerHTML = "ボールが投げられました！";
                }
            }
        });

        // p5.jsGameLogic
        let ballX;
        let ballZ; 
        let ballRadius = 20;
        let ballVX = 0; 
        let ballVZ = 0; 
        let friction = 0.99; 

        let pins = [];
        const PIN_RADIUS = 10;
        const PIN_HEIGHT = 50; 
        const PIN_LANE_Z = -300; 
        const LANE_WIDTH = 250;
        const LANE_LENGTH = 1000;
        const CANVAS_SIZE = 800;

        // ピンの初期配置 (X座標とZ座標)
        const pinInitialOffsets = [
            { x: 0, z: PIN_LANE_Z },
            { x: -PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 3 },
            { x: PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 3 },
            { x: -PIN_RADIUS * 4, z: PIN_LANE_Z - PIN_RADIUS * 6 },
            { x: 0, z: PIN_LANE_Z - PIN_RADIUS * 6 },
            { x: PIN_RADIUS * 4, z: PIN_LANE_Z - PIN_RADIUS * 6 },
            { x: -PIN_RADIUS * 6, z: PIN_LANE_Z - PIN_RADIUS * 9 },
            { x: -PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 9 },
            { x: PIN_RADIUS * 2, z: PIN_LANE_Z - PIN_RADIUS * 9 },
            { x: PIN_RADIUS * 6, z: PIN_LANE_Z - PIN_RADIUS * 9 },
        ];

        // インスタンスモードを使用する（独立させる）
        const sketch = (p) => {
            p.setup = () => {
                // 元のコードを参考に 800x800 の WEBGL モードを使用
                p.createCanvas(CANVAS_SIZE, CANVAS_SIZE, p.WEBGL).parent('game-container');
                p.angleMode(p.DEGREES); 
                p.noStroke();
                
                // 元のコードのカメラ設定を参考に3Dカメラを設定
                // camera(eyeX, eyeY, eyeZ, centerX, centerY, centerZ, upX, upY, upZ)
                p.camera(0, 500, 300, // カメラ位置: 上から手前
                         0, 0, 0,     // 注視点: レーンの中心
                         0, 1, 0);    // 上方向
                
                p.resetBallAndPins();
                window.p5Instance = p;
            };

            p.draw = () => {
                p.background(0); // 背景を黒に設定
                p.orbitControl(); // 3D操作を有効化
                
                // 光源設定
                p.ambientLight(50, 50, 50);
                p.directionalLight(255, 255, 255, 0, 1, -1);
                p.pointLight(200, 200, 200, 0, 300, 300); 
                
                // レーンの描画
                p.drawLane();

                // ボールの更新と描画
                p.updateBall();
                p.drawBall();

                // ピンの描画と衝突判定
                p.drawPins();
            };
            
            p.drawLane = () => {
                p.push();
                p.fill(139, 69, 19); // レーン：茶色
                // Y=0を床面とするため、Y座標を調整 (高さ10の半分)
                p.translate(0, 5, -LANE_LENGTH/2 + 200); 
                p.box(LANE_WIDTH, 10, LANE_LENGTH); // 幅250, 高さ10, 奥行き1000
                p.pop();
            }
            
            p.updateBall = () => {
                if (isThrown) {
                    ballX += ballVX;
                    ballZ += ballVZ;

                    ballVX *= friction;
                    ballVZ *= friction;

                    let halfLaneWidth = LANE_WIDTH / 2;
                    if (ballX < -halfLaneWidth + ballRadius || ballX > halfLaneWidth - ballRadius) {
                        ballVX *= -0.8; 
                        ballX = p.constrain(ballX, -halfLaneWidth + ballRadius, halfLaneWidth - ballRadius);
                    }
                    
                    if (ballZ < -LANE_LENGTH / 2) {
                        ballVZ = 0;
                    }

                    if (p.abs(ballVX) < 0.1 && p.abs(ballVZ) < 0.1) {
                        if (isThrown) {
                            p.checkScore();
                            isThrown = false;
                            statusDiv.innerHTML = "投球終了。スコアを確認し、リセットしてください。";
                        }
                    }

                    if (ballZ < PIN_LANE_Z + 100) { 
                        p.handleCollision();
                    }
                }
            };

            p.drawBall = () => {
                p.push();
                p.specularMaterial(223, 41, 53); // ボール：赤
                p.translate(ballX, -ballRadius, ballZ); 
                p.sphere(ballRadius);
                p.pop();
            };

            p.drawPins = () => {
                p.fill(255); // ピン：白
                pins.forEach(pin => {
                    p.push();
                    p.translate(pin.x, -PIN_HEIGHT/2, pin.z); 
                    
                    if (!pin.isDown) {
                        p.cylinder(PIN_RADIUS, PIN_HEIGHT); 
                    } else {
                        p.fill(170); // 倒れたピンは灰色
                        p.rotateX(90); 
                        p.cylinder(PIN_RADIUS, PIN_HEIGHT); 
                    }
                    p.pop();
                });
            };

            p.handleCollision = () => {
                pins.forEach(pin => {
                    if (!pin.isDown) {
                        const dist = p.dist(ballX, ballZ, pin.x, pin.z);
                        
                        if (dist < ballRadius + PIN_RADIUS) {
                            pin.isDown = true;
                            
                            // 簡易的な連鎖的な倒れ方を実現するためのロジック
                            pinInitialOffsets.forEach((otherOffset, otherIndex) => {
                                if (pin !== pins[otherIndex] && !pins[otherIndex].isDown) {
                                    const chainDist = p.dist(pin.x, pin.z, otherOffset.x, otherOffset.z);
                                    if (chainDist < PIN_RADIUS * 4 && p.random(1) < 0.5) { 
                                         pins[otherIndex].isDown = true;
                                    }
                                }
                            });
                        }
                    }
                });
            };
            
            p.checkScore = () => {
                let currentKnocked = 0;
                pins.forEach(pin => {
                    if (pin.isDown && !pin.counted) {
                        pin.counted = true;
                        currentKnocked++;
                    }
                });

                if (currentKnocked > 0) {
                    pinsKnocked += currentKnocked;
                    score += currentKnocked;
                    scoreDiv.innerHTML = `${pinsKnocked} / ${score}`;
                }
            };
            
            p.resetBallAndPins = () => {
                ballX = 0;
                ballZ = 300; 
                ballVX = 0;
                ballVZ = 0;
                
                pins = pinInitialOffsets.map(offset => ({
                    x: offset.x,
                    z: offset.z, 
                    isDown: false,
                    counted: false,
                }));
            };

            p.throwBall = (g, b) => {
                const MAX_SPEED = 20; 
                const MIN_SPEED = 5;  
                const THROW_FACTOR = 0.5; 

                let forwardVelocity = p.constrain(p.abs(b) * THROW_FACTOR, MIN_SPEED, MAX_SPEED);
                ballVZ = -forwardVelocity; 
                
                let lateralVelocity = p.constrain(g * THROW_FACTOR * 0.5, -MAX_SPEED / 2, MAX_SPEED / 2);
                ballVX = lateralVelocity;

                isThrown = true;
                btnReset.disabled = false;
                
                console.log(`Throwing Ball: VX=${ballVX.toFixed(2)}, VZ=${ballVZ.toFixed(2)}`);
            };

            p.windowResized = () => {
                const container = document.getElementById('game-container');
                // 画面サイズは元のコードに合わせて固定
            };
        };

        new p5(sketch, 'game-container');

        // --- ゲームのリセット (HTMLボタン用) ---
        function resetGame() {
            pinsKnocked = 0;
            scoreDiv.innerHTML = `${pinsKnocked} / ${score}`;
            if (window.p5Instance) {
                window.p5Instance.resetBallAndPins();
            }
            isThrown = false;
            statusDiv.innerHTML = isReadyToThrow ? "投球準備OK！スマホを振ってください。" : "接続待ち...";
        }
    </script>
  </body>
</html>
